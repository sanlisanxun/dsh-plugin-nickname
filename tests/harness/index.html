<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>dsh 插件页结构复刻 · nickname 验证</title>
<style>
  body { margin: 0; padding: 24px; background: #16171a; color: #e6e6e6;
         font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  h2 { font-size: 13px; color: #9aa0a6; margin: 0 0 16px; font-weight: 600; }
  ul.cards { list-style: none; margin: 0; padding: 0; max-width: 560px; }
  li.card { background: #1e2024; border: 1px solid rgba(255,255,255,.08);
            border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .cardHead { display: flex; align-items: flex-start; gap: 12px; }
  .cardIcon { width: 32px; height: 32px; border-radius: 8px; background: #2c2f36;
              display: inline-block; flex: none; }
  .cardMain { flex: 1; min-width: 0; }
  .titleRow { display: flex; align-items: center; gap: 6px; }
  .cardTitle { background: none; border: 0; padding: 0; color: #fff; font-size: 14px;
               font-weight: 600; cursor: pointer; text-align: left; }
  .cardTitle:hover { text-decoration: underline; }
  .cardDesc { display: block; color: #9aa0a6; font-size: 12px; margin-top: 2px; }
  .cardEnd { flex: none; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #4caf50; display: inline-block; }
  code { color: #7a828a; font-size: 11px; }
  #hint { max-width: 560px; margin-top: 20px; padding: 10px 12px; border-radius: 8px;
          background: #23262b; color: #9aa0a6; font-size: 12px; }
</style>
</head>
<body>

<h2>已安装 7</h2>
<ul class="cards" id="cards"></ul>

<div id="hint">结构完全按 dsh 插件管理页 CardHead/PackageCard 复刻：li[data-plugin-package] &gt; div.cardHead &gt; div.cardMain &gt; div.titleRow &gt; button.cardTitle</div>

<script>
const DATA = [
  ['@deepseek-ai/dsh-ui-theme',           '@deepseek-ai/dsh-ui-theme',           '官方主题插件（官方插件，默认不可改名）'],
  ['@kenz1117/dsh-ui-usage-billing',      '@kenz1117/dsh-ui-usage-billing',      '用量计费面板：按会话统计 token 与费用'],
  ['@linxin666/dsh-client-ui-task-board', '@linxin666/dsh-client-ui-task-board', 'Host-authoritative task board'],
  ['dsh-context',                          '上下文 (dsh-context)',                '上下文洞察与管理插件：提供跨会话的上下文浏览'],
  ['dsh-cost-meter',                       '费用计量 (dsh-cost-meter)',           '费用计量：按会话统计 token 与成本'],
  ['dsh-plugin-simplemanager',             '插件管家 (dsh-plugin-simplemanager)', '内核版本看板 + 第三方插件统一管理'],
  ['dsh-plugin-nickname',                  'dsh-plugin-nickname',                 'dsh 插件名称修改：给插件列表里的插件自定义中文备注名']
];

const NICK = {
  '@deepseek-ai/dsh-ui-theme': '官方主题',
  '@kenz1117/dsh-ui-usage-billing': '用量计费面板',
  '@linxin666/dsh-client-ui-task-board': '任务看板',
  'dsh-context': '上下文管理',
  'dsh-cost-meter': '费用计量',
  'dsh-plugin-simplemanager': '插件管家'
};

// 模拟 dsh 的模块加载器
window.__ModuleLoader__ = { load(def) { window.__NICK_DEF__ = def; } };

const params = new URLSearchParams(location.search);
const preset = {};
if (params.get('group')) preset.groupBy = params.get('group');
if (params.get('tags')) {
  preset.groupBy = preset.groupBy || 'tags';
  preset.tags = { custom: ['我的标签'], assignments: { '@kenz1117/dsh-ui-usage-billing': ['我的标签'] } };
}
if (Object.keys(preset).length) {
  localStorage.setItem('dsh_plugin_nicknames_settings', JSON.stringify(preset));
}
localStorage.setItem('dsh_plugin_nicknames', JSON.stringify(NICK));

document.getElementById('cards').innerHTML = DATA.map(([pkg, title, desc]) => `
  <li class="card" data-plugin-package="${pkg}">
    <div class="cardHead">
      <span class="cardIcon" aria-hidden="true"></span>
      <div class="cardMain">
        <div class="titleRow">
          <button type="button" class="cardTitle cardOpen">${title}</button>
        </div>
        <span class="cardDesc">${desc}</span>
      </div>
      <div class="cardEnd"><span class="dot"></span></div>
    </div>
  </li>`).join('');
</script>
<script src="/lib/client.js"></script>
<script>
  window.__NICK_DISPOSE__ = window.__NICK_DEF__.factory().apply({});
  // ?open=1 自动展开编辑面板，便于截图验证
  if (new URLSearchParams(location.search).get('open') === '1') {
    setTimeout(() => {
      const btn = document.getElementById('nickname-float-btn');
      if (btn) btn.dispatchEvent(new MouseEvent('click', { bubbles: true }));
    }, 400);
  }
  // ?collapse=<分组名> 面板展开后自动折叠该分组，用于折叠功能验证
  const collapseName = new URLSearchParams(location.search).get('collapse');
  if (collapseName) {
    setTimeout(() => {
      const h = document.querySelector(`.nickname-group-header[data-group="${collapseName}"]`);
      if (h) h.dispatchEvent(new MouseEvent('click', { bubbles: true }));
    }, 900);
  }
  // ?tagflow=1 增/删标签闭环自检：真实点击「+标签→建」与高级区「✕」，把结果写进 body[data-tagflow]
  if (new URLSearchParams(location.search).get('tagflow') === '1') {
    const TAG = '验收标签甲';
    const readSettings = () => { try { return JSON.parse(localStorage.getItem('dsh_plugin_nicknames_settings') || '{}'); } catch (e) { return {}; } };
    setTimeout(() => {
      const btn = document.getElementById('nickname-float-btn');
      if (btn) btn.dispatchEvent(new MouseEvent('click', { bubbles: true }));
    }, 400);
    setTimeout(() => {
      const out = { ok: false };
      try {
        const panel = document.getElementById('nickname-edit-panel');
        if (!panel) throw new Error('panel-not-open');
        const addBtn = panel.querySelector('.nickname-tags .nickname-tag-add');
        if (!addBtn) throw new Error('no-add-btn');
        const tagsRow = addBtn.closest('.nickname-tags');
        const pkg = tagsRow.dataset.pkg;
        addBtn.click();
        const input = tagsRow.querySelector('.nickname-tag-input');
        const createBtn = tagsRow.querySelector('.nickname-tag-create');
        if (!input || !createBtn) throw new Error('no-inline-input');
        input.value = TAG;
        createBtn.click();
        const s1 = readSettings(); const t1 = s1.tags || {};
        out.create = {
          pkg: pkg,
          inCustom: (t1.custom || []).indexOf(TAG) !== -1,
          inAssign: ((t1.assignments || {})[pkg] || []).indexOf(TAG) !== -1,
          chipOn: !!panel.querySelector('.nickname-tags[data-pkg="' + pkg + '"] .tag-toggle.on[data-tag="' + TAG + '"]'),
          inManager: !!panel.querySelector('.nickname-tag-del[data-tag="' + TAG + '"]')
        };
        const del = panel.querySelector('.nickname-tag-del[data-tag="' + TAG + '"]');
        out.delete = { foundDel: !!del };
        if (del) del.click();
        const s2 = readSettings(); const t2 = s2.tags || {};
        out.delete.notInCustom = (t2.custom || []).indexOf(TAG) === -1;
        out.delete.notInAssign = ((t2.assignments || {})[pkg] || []).indexOf(TAG) === -1;
        out.delete.managerGone = !panel.querySelector('.nickname-tag-del[data-tag="' + TAG + '"]');
        out.ok = out.create.inCustom && out.create.inAssign && out.create.chipOn && out.create.inManager
          && out.delete.foundDel && out.delete.notInCustom && out.delete.notInAssign && out.delete.managerGone;
      } catch (e) {
        out.err = String((e && e.message) || e);
      }
      document.body.dataset.tagflow = JSON.stringify(out);
    }, 1200);
  }
  // ?taglimit=1 连建 5 个标签（验证无 3 上限）并删除其中名为 "1" 的标签，结果写进 body[data-taglimit]
  if (new URLSearchParams(location.search).get('taglimit') === '1') {
    const NAMES = ['1', '标签B', '标签C', '标签D', '标签E'];
    const readSettings = () => { try { return JSON.parse(localStorage.getItem('dsh_plugin_nicknames_settings') || '{}'); } catch (e) { return {}; } };
    setTimeout(() => {
      const btn = document.getElementById('nickname-float-btn');
      if (btn) btn.dispatchEvent(new MouseEvent('click', { bubbles: true }));
    }, 400);
    setTimeout(() => {
      const out = { ok: false };
      try {
        const panel = document.getElementById('nickname-edit-panel');
        if (!panel) throw new Error('panel-not-open');
        const first = panel.querySelector('.nickname-tags .nickname-tag-add');
        const pkg = first.closest('.nickname-tags').dataset.pkg;
        NAMES.forEach((nm) => {
          const row = panel.querySelector('.nickname-tags[data-pkg="' + pkg + '"]');
          row.querySelector('.nickname-tag-add').click();
          const inp = row.querySelector('.nickname-tag-input');
          const crt = row.querySelector('.nickname-tag-create');
          inp.value = nm; crt.click();
        });
        const t1 = readSettings().tags || {};
        out.createdAll5 = NAMES.every((nm) => (t1.custom || []).indexOf(nm) !== -1);
        out.customCount = (t1.custom || []).length;
        out.managerCount = panel.querySelectorAll('#nickname-tag-manager .nickname-tag-del').length;
        // ① 高级管理区 ✕ 删 "1"
        const del1 = panel.querySelector('.nickname-tag-del[data-tag="1"]');
        out.foundDel1 = !!del1;
        if (del1) del1.click();
        const t2 = readSettings().tags || {};
        out.gone1Custom = (t2.custom || []).indexOf('1') === -1;
        out.gone1Assign = ((t2.assignments || {})[pkg] || []).indexOf('1') === -1;
        out.gone1Manager = !panel.querySelector('.nickname-tag-del[data-tag="1"]');
        out.chip1Gone = !panel.querySelector('.nickname-tags[data-pkg="' + pkg + '"] .tag-toggle[data-tag="1"]');
        out.mgrAfter1 = panel.querySelectorAll('#nickname-tag-manager .nickname-tag-del').length;
        // ② 条目内联 ✕ 删 "标签B"（confirm 自动确认）
        window.confirm = () => true;
        const xb = panel.querySelector('.nickname-tag-x[data-tag="标签B"]');
        out.foundXB = !!xb;
        if (xb) xb.click();
        const t3 = readSettings().tags || {};
        out.goneBCustom = (t3.custom || []).indexOf('标签B') === -1;
        out.goneBAssign = ((t3.assignments || {})[pkg] || []).indexOf('标签B') === -1;
        out.goneBManager = !panel.querySelector('.nickname-tag-del[data-tag="标签B"]');
        out.chipBGone = !panel.querySelector('.nickname-tags[data-pkg="' + pkg + '"] .tag-toggle[data-tag="标签B"]');
        out.mgrAfter2 = panel.querySelectorAll('#nickname-tag-manager .nickname-tag-del').length;
        out.ok = out.createdAll5 && out.customCount === 5 && out.managerCount === 5
          && out.foundDel1 && out.gone1Custom && out.gone1Assign && out.gone1Manager && out.chip1Gone && out.mgrAfter1 === 4
          && out.foundXB && out.goneBCustom && out.goneBAssign && out.goneBManager && out.chipBGone && out.mgrAfter2 === 3;
      } catch (e) {
        out.err = String((e && e.message) || e);
      }
      document.body.dataset.taglimit = JSON.stringify(out);
    }, 1400);
  }
</script>
</body>
</html>
